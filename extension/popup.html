<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; margin: 0; padding: 10px; width: 370px; }
    h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
    .row { padding: 9px 0; border-top: 1px solid #eee; }
    .row a { display: block; color: #0d9488; text-decoration: none; overflow-wrap: anywhere; }
    .row a:hover { text-decoration: underline; }
    button { font: 12px inherit; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background: #f6f6f6; padding: 3px 8px; }
    button:hover:not(:disabled) { background: #eee; }
    button:disabled { color: #aaa; cursor: default; }
    .empty { color: #888; padding: 7px 0; }
    .status { color: #555; margin-top: 5px; }
    .error { color: #a12525; overflow-wrap: anywhere; white-space: pre-wrap; margin-top: 4px; max-height: 8em; overflow-y: auto; }
    .controls { display: flex; gap: 6px; margin-top: 7px; }
    .footer { margin-top: 8px; padding-top: 8px; border-top: 1px solid #eee; text-align: right; }
  </style>
</head>
<body>
  <h1>Portluck tunnels</h1>
  <div id="list"></div>
  <div id="popup-error" class="error" role="alert"></div>
  <div class="footer">
    <button id="clear-history" title="Clear the address-bar history of host:port entries">Clear history</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
